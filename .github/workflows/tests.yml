name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04            # pinned: the newest default image has no Python 3.9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System library for the PNG and PDF figures
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install
        run: python -m pip install --upgrade pip && pip install ".[test,ligand,pdf,server]" pyyaml
      - name: Versions agree and CHANGELOG is up to date
        run: python tools/bump_version.py --check
      - name: Tests
        run: python -m pytest -q tests
