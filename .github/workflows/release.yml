name: release
# Runs when a tag such as v0.6.0 is pushed: checks that the tag matches the version, builds the files and makes a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, version files and CHANGELOG must agree
        run: |
          python tools/bump_version.py --check
          V=$(python - <<'PY'
          import re
          print(re.search(r'__version__ = "([^"]+)"', open("ifacekit/__init__.py").read()).group(1))
          PY
          )
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $V"; exit 1; }
      - name: Build the archive, wheel and source distribution
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=ifacekit/ "$GITHUB_REF_NAME" -o "dist/ifacekit_${GITHUB_REF_NAME#v}.tgz"
          python -m pip install build && python -m build --outdir dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ifacekit ${GITHUB_REF_NAME#v}" --generate-notes
